<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>Mesoamerican Languages</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

    <!-- ArcGIS Maps SDK for JavaScript, loads the map components used below -->
    <link rel="stylesheet" href="https://js.arcgis.com/5.1/esri/themes/light/main.css">
    <script type="module" src="https://js.arcgis.com/5.1/"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:ital,wght@0,400;0,500;0,600;0,700;1,500;1,600&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/popup.css">
    <link rel="stylesheet" href="css/interpreters-panel.css">
    <link rel="stylesheet" href="css/search.css">

    <script type="module" src="js/main.js"></script>
</head>

<body>
    <main class="app">
        <!-- basemap, center, and zoom get set from MAP in js/map.js -->
        <arcgis-map id="map" aria-label="Interactive map">
            <!-- search bar w/ the map controls beside it, js/search.js fills in the results -->
            <div class="map-toolbar" slot="top-left">
                <div class="map-search" id="search" role="search">
                    <label class="visually-hidden" for="search-input">Search languages and places</label>
                    <div class="map-search-field">
                        <input class="map-search-input" id="search-input" type="text" role="combobox"
                            aria-autocomplete="list" aria-expanded="false" aria-controls="search-results"
                            placeholder="Search by language, language family, or place…"
                            autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="search">
                        <button class="map-search-clear" id="search-clear" type="button" aria-label="Clear search" hidden>×</button>
                    </div>
                    <ul class="map-search-results" id="search-results" role="listbox" aria-label="Search results" hidden></ul>
                    <p class="visually-hidden" id="search-status" role="status" aria-live="polite"></p>
                </div>
                <arcgis-zoom layout="horizontal"></arcgis-zoom>
                <arcgis-home></arcgis-home>
            </div>
            <section class="interpreters-panel" id="interpreters" slot="bottom-left">
                <div class="interpreters-header">
                    <h2>Interpreters</h2>
                    <button class="interpreters-clear" id="interpreters-clear" type="button" aria-label="Clear interpreter selection" hidden>Clear</button>
                </div>
                <ul id="interpreters-list"></ul>
            </section>
        </arcgis-map>
    </main>
</body>

</html>
